name: Release standalone binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build binaries for'
        required: true
        default: 'v0.14.1'

permissions:
  contents: write

env:
  TOKA_VERSION: v1.0.0-rc.11

jobs:
  build-source:
    name: Build source archive (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Linux dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          sudo apt-get install -y libssl3 zlib1g libzstd1 libstdc++6 libgcc-s1 ripgrep

      - name: Install Toka SDK (RC11)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/toka-v1.0.0-rc.11-linux-x64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/tokalang/toka/releases/download/$TOKA_VERSION/toka-v1.0.0-rc.11-linux-x64.tar.gz"
          echo "24169a99aba87fd94f16699eadd2a7623d8862a3fe27dec06c46f95b53346917  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/toka-v1.0.0-rc.11-linux-x64"
          echo "TOKA=$sdk/bin/toka" >> "$GITHUB_ENV"
          echo "TOKAC=$sdk/bin/tokac" >> "$GITHUB_ENV"
          echo "TOKA_COMPILER=$sdk/bin/tokac" >> "$GITHUB_ENV"
          echo "TOKA_LIB=$sdk/lib" >> "$GITHUB_ENV"
          echo "PATH=$sdk/bin:$PATH" >> "$GITHUB_ENV"

      - name: Build and verify source archive
        id: pack-source
        run: |
          set -euo pipefail
          toka publish
          archive_file=$(ls trg-*.tar.gz | head -n 1)
          python3 tests/verify_application_release.py --archive "$archive_file"
          echo "source_archive=$archive_file" >> "$GITHUB_OUTPUT"

      - name: Upload source archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-archive
          path: ${{ steps.pack-source.outputs.source_archive }}

  build-binaries:
    name: Build binary (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            asset: toka-v1.0.0-rc.11-linux-x64.tar.gz
            sha256: 24169a99aba87fd94f16699eadd2a7623d8862a3fe27dec06c46f95b53346917
          - name: macos-arm64
            runner: macos-15
            asset: toka-v1.0.0-rc.11-macos-arm64.tar.gz
            sha256: 20e32db7246f75fb59bc452c411e59ab5df8b4ecbd3dbc4beb9b2d6e4532d07b
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          sudo apt-get install -y libssl3 zlib1g libzstd1 libstdc++6 libgcc-s1 ripgrep

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install lld@20 zstd openssl@3 ripgrep

      - name: Install Toka SDK (RC11)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/${{ matrix.asset }}"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/tokalang/toka/releases/download/$TOKA_VERSION/${{ matrix.asset }}"
          echo "${{ matrix.sha256 }}  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/${{ matrix.asset }}"
          sdk="${sdk%.tar.gz}"
          echo "TOKA=$sdk/bin/toka" >> "$GITHUB_ENV"
          echo "TOKAC=$sdk/bin/tokac" >> "$GITHUB_ENV"
          echo "TOKA_COMPILER=$sdk/bin/tokac" >> "$GITHUB_ENV"
          echo "TOKA_LIB=$sdk/lib" >> "$GITHUB_ENV"
          echo "PATH=$sdk/bin:$PATH" >> "$GITHUB_ENV"

      - name: Build standalone release binary
        run: |
          toka fetch
          toka build
          ./target/debug/trg -V

      - name: Package and verify standalone archive
        id: pack
        run: |
          tag_name="${{ github.ref_name }}"
          if [ -z "$tag_name" ] || [ "$tag_name" = "main" ]; then
            tag_name="${{ inputs.tag }}"
          fi
          arch_name="trg-${tag_name}-${{ matrix.name }}"
          mkdir -p "$RUNNER_TEMP/$arch_name"
          cp target/debug/trg "$RUNNER_TEMP/$arch_name/"
          cp LICENSE "$RUNNER_TEMP/$arch_name/"
          cp README.md "$RUNNER_TEMP/$arch_name/"
          tar -czf "$arch_name.tar.gz" -C "$RUNNER_TEMP" "$arch_name"
          shasum -a 256 "$arch_name.tar.gz"
          ver_expected="${tag_name#v}"
          python3 tests/verify_standalone_binary.py --archive "$arch_name.tar.gz" --expected-version "$ver_expected" --run-matrix
          echo "tarball=$arch_name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.pack.outputs.tarball }}

  publish-release:
    name: Attach standalone binaries to GitHub Release
    needs: [build-binaries, build-source]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute checksums
        run: |
          cd dist
          shasum -a 256 trg-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish draft release safely without clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_name="${{ github.ref_name }}"
          if [ -z "$tag_name" ] || [ "$tag_name" = "main" ]; then
            tag_name="${{ inputs.tag }}"
          fi
          notes_file="docs/release_notes/${tag_name}.md"
          if [ ! -f "$notes_file" ]; then
            notes_file="docs/release_notes/v0.14.1.md"
          fi
          python3 tests/safe_release_upload.py --tag "$tag_name" --dist-dir dist --notes-file "$notes_file"
