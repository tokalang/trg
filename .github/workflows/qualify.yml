name: Package qualification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  TOKA_VERSION: v1.0.0-rc.11

jobs:
  qualify-unix:
    name: trg qualification (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            asset: toka-v1.0.0-rc.11-linux-x64.tar.gz
            sha256: 24169a99aba87fd94f16699eadd2a7623d8862a3fe27dec06c46f95b53346917
          - name: macos-arm64
            runner: macos-15
            asset: toka-v1.0.0-rc.11-macos-arm64.tar.gz
            sha256: 20e32db7246f75fb59bc452c411e59ab5df8b4ecbd3dbc4beb9b2d6e4532d07b
    steps:
      - name: Check out package
        uses: actions/checkout@v4

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          sudo apt-get install -y libssl3 zlib1g libzstd1 libstdc++6 libgcc-s1 ripgrep

      - name: Install macOS runtime dependencies
        if: runner.os == 'macOS'
        run: brew install lld@20 zstd openssl@3 ripgrep

      - name: Install locked Toka SDK (RC11)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/${{ matrix.asset }}"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/tokalang/toka/releases/download/$TOKA_VERSION/${{ matrix.asset }}"
          echo "${{ matrix.sha256 }}  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/${{ matrix.asset }}"
          sdk="${sdk%.tar.gz}"
          "$sdk/bin/toka" --version | grep -F '1.0.0-rc.11'
          "$sdk/bin/tokac" --version | grep -F '1.0.0-rc.11'
          echo "TOKA=$sdk/bin/toka" >> "$GITHUB_ENV"
          echo "TOKAC=$sdk/bin/tokac" >> "$GITHUB_ENV"
          echo "TOKA_COMPILER=$sdk/bin/tokac" >> "$GITHUB_ENV"
          echo "TOKA_LIB=$sdk/lib" >> "$GITHUB_ENV"
          echo "PATH=$sdk/bin:$PATH" >> "$GITHUB_ENV"

      - name: Validate manifest and doctor
        run: |
          toka doctor
          toka check --json package.tk

      - name: Run qualification suite
        run: python3 tests/qualify.py

      - name: Run single-file symbol view test suite
        run: python3 tests/test_view_symbol.py
        env:
          TRG_BIN: ./target/debug/trg

      - name: Run view continuation test suite
        run: python3 tests/test_view_continuation.py
        env:
          TRG_BIN: ./target/debug/trg

      - name: Run search scope boundary suite
        run: python3 tests/test_search_scope_suite.py ./target/debug/trg
        env:
          TRG_BIN: ./target/debug/trg

      - name: Verify standalone installer behavior
        run: python3 tests/verify_installer.py

      - name: Verify application package release archive
        run: |
          toka publish
          archive_file=$(ls trg-*.tar.gz | head -n 1)
          python3 tests/verify_application_release.py --archive "$archive_file"

      - name: Verify WinGet package manifests
        run: python3 -m unittest tests/test_winget_manifest.py

      - name: Verify Homebrew formula generator
        run: python3 -m unittest tests/test_homebrew_formula.py

      - name: Verify Windows install.ps1 script
        run: python3 -m unittest tests/test_install_ps1.py

      - name: Verify release asset publisher logic
        run: python3 -m unittest tests/test_safe_release_upload.py

  build-cross-windows-objects:
    name: Cross-compile Windows objects (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out package
        uses: actions/checkout@v4

      - name: Install locked Toka SDK (RC11)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/toka-v1.0.0-rc.11-linux-x64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/tokalang/toka/releases/download/$TOKA_VERSION/toka-v1.0.0-rc.11-linux-x64.tar.gz"
          echo "24169a99aba87fd94f16699eadd2a7623d8862a3fe27dec06c46f95b53346917  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/toka-v1.0.0-rc.11-linux-x64"
          echo "TOKA=$sdk/bin/toka" >> "$GITHUB_ENV"
          echo "TOKAC=$sdk/bin/tokac" >> "$GITHUB_ENV"
          echo "TOKA_LIB=$sdk/lib" >> "$GITHUB_ENV"
          echo "PATH=$sdk/bin:$PATH" >> "$GITHUB_ENV"

      - name: Fetch Toka package dependencies
        run: |
          toka fetch

      - name: Cross-compile Windows COFF objects
        run: |
          set -euo pipefail
          mkdir -p build_win
          export TOKA_LIB
          "$TOKAC" --target x86_64-pc-windows-gnu -c -I . -I .toka/packages/regex-0.3.0/lib src/main.tk -o build_win/trg_x64.o
          "$TOKAC" --target aarch64-pc-windows-gnu -c -I . -I .toka/packages/regex-0.3.0/lib src/main.tk -o build_win/trg_arm64.o
          cp "$TOKA_LIB/sys/toka_rt.c" build_win/
          cp src/c/trg_win_compat.c build_win/
          cp src/c/trg.manifest build_win/
          cp src/c/trg.rc build_win/
          cp tests/test_c_bridge_write.c build_win/

      - name: Upload Windows build inputs
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-inputs
          path: build_win/

  qualify-windows-x64:
    name: trg qualification (windows-x64 on windows-2025)
    needs: build-cross-windows-objects
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-python

      - name: Verify locked toolchain provenance
        run: |
          echo "=== Windows x64 Toolchain Info ==="
          clang --version
          windres --version
          pacman -Q mingw-w64-x86_64-clang mingw-w64-x86_64-binutils mingw-w64-x86_64-lld

      - name: Download Windows build inputs
        uses: actions/download-artifact@v4
        with:
          name: windows-build-inputs
          path: build_win

      - name: Link trg.exe & compile C bridge test (x64)
        run: |
          set -euo pipefail
          windres build_win/trg.rc -O coff -o build_win/trg_manifest.o
          clang -c build_win/trg_win_compat.c -O2 -o build_win/trg_win_compat.o
          clang -c build_win/toka_rt.c -O2 -DENOSYS=40 -DWIN32_LEAN_AND_MEAN -o build_win/toka_rt.o
          clang build_win/trg_x64.o build_win/trg_win_compat.o build_win/trg_manifest.o build_win/toka_rt.o \
            -o trg.exe -lbcrypt -lws2_32 -lshell32
          ./trg.exe -V | grep -F "0.19.0"
          clang build_win/trg_win_compat.c build_win/test_c_bridge_write.c \
            -o test_c_write_x64.exe -lkernel32 -lmsvcrt -O2

      - name: Verify 0 third-party DLL dependencies
        run: |
          python3 -c "
          from tests.verify_standalone_binary import verify_dll_dependencies
          import pathlib
          res = verify_dll_dependencies(pathlib.Path('trg.exe'))
          assert res['checked'] and res['third_party_dll_count'] == 0, f'Disallowed DLLs: {res}'
          print('DLL Check: 0 third-party DLLs detected.', res)
          "

      - name: Run single-file symbol view test suite (Windows x64)
        run: python3 tests/test_view_symbol.py
        env:
          TRG_BIN: trg.exe

      - name: Run view continuation test suite (Windows x64)
        run: python3 tests/test_view_continuation.py
        env:
          TRG_BIN: trg.exe

      - name: Run search scope boundary suite (Windows x64)
        run: python3 tests/test_search_scope_suite.py trg.exe
        env:
          TRG_BIN: trg.exe

      - name: Run Windows qualification matrix (native x64)
        run: python3 tests/test_windows_matrix.py --trg trg.exe --c-test test_c_write_x64.exe --arch x64

      - name: Setup pinned ripgrep (v15.1.0 x64) for differential parity
        run: |
          set -euo pipefail
          curl -fsSL -o rg_x64.zip https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-pc-windows-msvc.zip
          python3 -c "
          import hashlib, zipfile, shutil, glob
          expected = '124510b94b6baa3380d051fdf4650eaa80a302c876d611e9dba0b2e18d87493a'
          with open('rg_x64.zip', 'rb') as f:
              actual = hashlib.sha256(f.read()).hexdigest()
          assert actual == expected, f'SHA256 mismatch: {actual} != {expected}'
          print(f'Verified rg_x64.zip SHA256: {actual}')
          with zipfile.ZipFile('rg_x64.zip') as z:
              for f in z.namelist():
                  if f.endswith('rg.exe'):
                      z.extract(f, 'bin_rg')
          for p in glob.glob('bin_rg/**/rg.exe', recursive=True):
              shutil.copy(p, 'rg.exe')
          "
          ./rg.exe --version

      - name: Run Ripgrep differential parity suite (Windows x64)
        run: python3 tests/test_rg_differential.py --trg trg.exe --rg ./rg.exe

  qualify-windows-arm64:
    name: trg qualification (windows-arm64 on windows-11-arm)
    needs: build-cross-windows-objects
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup MSYS2 CLANGARM64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-lld
            mingw-w64-clang-aarch64-binutils
            mingw-w64-clang-aarch64-python

      - name: Verify locked toolchain provenance
        run: |
          echo "=== Windows ARM64 Toolchain Info ==="
          clang --version
          windres --version
          pacman -Q mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-binutils mingw-w64-clang-aarch64-lld

      - name: Download Windows build inputs
        uses: actions/download-artifact@v4
        with:
          name: windows-build-inputs
          path: build_win

      - name: Link trg.exe & compile C bridge test (ARM64)
        run: |
          set -euo pipefail
          windres build_win/trg.rc -O coff -o build_win/trg_manifest.o
          clang -c build_win/trg_win_compat.c -O2 -o build_win/trg_win_compat.o
          clang -c build_win/toka_rt.c -O2 -DENOSYS=40 -DWIN32_LEAN_AND_MEAN -o build_win/toka_rt.o
          clang build_win/trg_arm64.o build_win/trg_win_compat.o build_win/trg_manifest.o build_win/toka_rt.o \
            -o trg.exe -lbcrypt -lws2_32 -lshell32
          ./trg.exe -V | grep -F "0.19.0"
          clang build_win/trg_win_compat.c build_win/test_c_bridge_write.c \
            -o test_c_write_arm64.exe -lkernel32 -lmsvcrt -O2

      - name: Verify 0 third-party DLL dependencies
        run: |
          python3 -c "
          from tests.verify_standalone_binary import verify_dll_dependencies
          import pathlib
          res = verify_dll_dependencies(pathlib.Path('trg.exe'))
          assert res['checked'] and res['third_party_dll_count'] == 0, f'Disallowed DLLs: {res}'
          print('DLL Check: 0 third-party DLLs detected.', res)
          "

      - name: Run single-file symbol view test suite (Windows ARM64)
        run: python3 tests/test_view_symbol.py
        env:
          TRG_BIN: trg.exe

      - name: Run view continuation test suite (Windows ARM64)
        run: python3 tests/test_view_continuation.py
        env:
          TRG_BIN: trg.exe

      - name: Run search scope boundary suite (Windows ARM64)
        run: python3 tests/test_search_scope_suite.py trg.exe
        env:
          TRG_BIN: trg.exe

      - name: Run Windows qualification matrix (native ARM64)
        run: python3 tests/test_windows_matrix.py --trg trg.exe --c-test test_c_write_arm64.exe --arch arm64

      - name: Setup pinned ripgrep (v15.1.0 ARM64) for differential parity
        run: |
          set -euo pipefail
          curl -fsSL -o rg_arm64.zip https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-aarch64-pc-windows-msvc.zip
          python3 -c "
          import hashlib, zipfile, shutil, glob
          expected = '00d931fb5237c9696ca49308818edb76d8eb6fc132761cb2a1bd616b2df02f8e'
          with open('rg_arm64.zip', 'rb') as f:
              actual = hashlib.sha256(f.read()).hexdigest()
          assert actual == expected, f'SHA256 mismatch: {actual} != {expected}'
          print(f'Verified rg_arm64.zip SHA256: {actual}')
          with zipfile.ZipFile('rg_arm64.zip') as z:
              for f in z.namelist():
                  if f.endswith('rg.exe'):
                      z.extract(f, 'bin_rg')
          for p in glob.glob('bin_rg/**/rg.exe', recursive=True):
              shutil.copy(p, 'rg.exe')
          "
          ./rg.exe --version

      - name: Run Ripgrep differential parity suite (Windows ARM64)
        run: python3 tests/test_rg_differential.py --trg trg.exe --rg ./rg.exe

  qualification-gate:
    name: Four-platform qualification gate
    if: always()
    needs: [qualify-unix, qualify-windows-x64, qualify-windows-arm64]
    runs-on: ubuntu-22.04
    steps:
      - name: Enforce all platform gates
        run: |
          echo "qualify-unix:          ${{ needs.qualify-unix.result }}"
          echo "qualify-windows-x64:   ${{ needs.qualify-windows-x64.result }}"
          echo "qualify-windows-arm64: ${{ needs.qualify-windows-arm64.result }}"
          test "${{ needs.qualify-unix.result }}" = "success"
          test "${{ needs.qualify-windows-x64.result }}" = "success"
          test "${{ needs.qualify-windows-arm64.result }}" = "success"
          echo "All four platforms (Linux x64, macOS arm64, Windows x64, Windows arm64) passed qualification!"
